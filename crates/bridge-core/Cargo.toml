[package]
name = "bridge-core"
version = "0.1.0"
edition = "2021"

[dependencies]
bridge-config = { path = "../bridge-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.10"
midir = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "net", "time"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
