name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3 separate macOS builds so Apple Silicon and Intel users each get a build built
          # specifically for their CPU, plus a universal one for anyone unsure which they need.
          # Tauri's dmg bundler names each output by arch on its own
          # (`${productName}_${version}_<aarch64|x64|universal>.dmg`), so the 3 don't collide and
          # are self-explanatory in the release's asset list without any renaming step.
          - platform: macos-latest
            rustTargets: aarch64-apple-darwin
            buildTarget: aarch64-apple-darwin
          - platform: macos-latest
            rustTargets: x86_64-apple-darwin
            buildTarget: x86_64-apple-darwin
          - platform: macos-latest
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            buildTarget: universal-apple-darwin
          - platform: windows-latest
            rustTargets: ''
            buildTarget: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.buildTarget != '' && format('--target {0}', matrix.buildTarget) || '' }}

      # Tauri's bundler only produces installers (msi/nsis) on Windows -- no portable/standalone
      # target exists. The raw compiled binary needs no install step to run (only the WebView2
      # runtime, which ships with Windows 10/11 by default), so it's uploaded as-is, renamed to
      # match the installer assets' own naming (`${productName}_${version}_x64-setup.exe`
      # convention), as an extra release asset alongside the installer.
      #
      # Path is target\release\, not src-tauri\target\release\ -- this repo's root Cargo.toml
      # declares a [workspace] with src-tauri as a member, so cargo puts build output in the
      # workspace root's target dir regardless of which member crate is built.
      - name: Prepare portable exe (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $dest = "Softube Console 1 MS Bridge_${version}_x64-portable.exe"
          Copy-Item target/release/bridge-tauri.exe $dest
          echo "PORTABLE_EXE_NAME=$dest" >> $env:GITHUB_ENV

      - name: Upload portable exe (Windows only)
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.PORTABLE_EXE_NAME }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
