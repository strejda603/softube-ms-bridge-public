[package]
name = "bridge-tauri"
version = "2.0.0"
description = "Softube Console 1 MS Bridge — Tauri desktop shell"
authors = ["Strejda603 <strejda603@centrum.cz>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix avoids a name collision with the bin target on Windows.
name = "bridge_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bridge-core = { path = "../crates/bridge-core" }
bridge-config = { path = "../crates/bridge-config" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "signal"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
chrono = "0.4"
midir = "0.11"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
coremidi = "0.9"
core-foundation = "0.10"
